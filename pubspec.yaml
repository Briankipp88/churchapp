name: sda_companion
description: A comprehensive SDA (Seventh-day Adventist) companion app featuring offline Bible access, SDA Hymnal, and Sabbath School lessons.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0
  json: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/hymnal/
    - assets/lessons/
